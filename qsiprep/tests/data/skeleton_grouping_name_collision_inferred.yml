# Per-axis curated fieldmaps, no MultipartID: two correction units (one per
# curated estimation - their fields are never blended). Both units are
# corrected, so their corrected results package into ONE final output
# ('sub-01'). Under the old one-level model this was a name collision.
'01':
  - anat:
      - suffix: T1w
    dwi:
      - dir: RL
        suffix: dwi
        metadata:
          PhaseEncodingDirection: 'i'
          TotalReadoutTime: 0.05
          B0FieldIdentifier: pepolar_i
          B0FieldSource: pepolar_i
      - dir: LR
        suffix: dwi
        metadata:
          PhaseEncodingDirection: 'i-'
          TotalReadoutTime: 0.05
          B0FieldIdentifier: pepolar_i
          B0FieldSource: pepolar_i
      - dir: PA
        suffix: dwi
        metadata:
          PhaseEncodingDirection: 'j'
          TotalReadoutTime: 0.05
          B0FieldIdentifier: pepolar_j
          B0FieldSource: pepolar_j
      - dir: AP
        suffix: dwi
        metadata:
          PhaseEncodingDirection: 'j-'
          TotalReadoutTime: 0.05
          B0FieldIdentifier: pepolar_j
          B0FieldSource: pepolar_j
