# Curated anatomical-registration SDC: the T2w carries a B0FieldIdentifier
# and the DWI names it as its B0FieldSource. Expected: a CURATED
# ANAT_CONTRAST estimation; tortoise executes T2Wreg; fsl/mixed raise an
# error because the user explicitly demanded a method those paths lack.
'01':
  - anat:
      - suffix: T1w
      - suffix: T2w
        metadata:
          B0FieldIdentifier: anatreg
    dwi:
      - dir: AP
        suffix: dwi
        metadata:
          PhaseEncodingDirection: 'j-'
          TotalReadoutTime: 0.05
          B0FieldSource: anatreg
