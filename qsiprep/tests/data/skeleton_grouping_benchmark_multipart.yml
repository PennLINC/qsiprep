# Benchmarking mode: a list-valued MultipartID places one series into several
# overlapping virtual acquisitions, each preprocessed independently. Here the
# reverse-PE b=0 is SHARED across the two outputs:
#   acq-solo: dir-AP alone - borrows dir-PA's b=0 for its PEPOLAR field.
#   acq-pair: dir-AP + dir-PA - the self-contained reverse pair.
# dir-AP is preprocessed twice; the one inferred axis-j field is estimated
# once per output (estimation-spans-outputs), and acq-solo borrows dir-PA -
# the field crosses the virtual-acquisition boundary. Contrast with
# benchmark_isolated_fields, where curated B0FieldIdentifiers keep two fields
# apart.
'01':
  - anat:
      - suffix: T1w
    dwi:
      - dir: AP
        suffix: dwi
        metadata:
          PhaseEncodingDirection: 'j-'
          TotalReadoutTime: 0.05
          MultipartID: [acq-solo, acq-pair]
      - dir: PA
        suffix: dwi
        metadata:
          PhaseEncodingDirection: 'j'
          TotalReadoutTime: 0.05
          MultipartID: acq-pair
