# One session-less PEPOLAR fmap (sub-01/fmap) declares 'shared_field'; DWIs
# in both sessions name it as B0FieldSource. Expected: one estimation applied
# across both sessions (with a cross-session-fieldmap-application warning),
# not split per session.
'01':
  - anat:
      - suffix: T1w
    fmap:
      - dir: AP
        suffix: epi
        metadata:
          PhaseEncodingDirection: 'j-'
          TotalReadoutTime: 0.05
          B0FieldIdentifier: shared_field
      - dir: PA
        suffix: epi
        metadata:
          PhaseEncodingDirection: 'j'
          TotalReadoutTime: 0.05
          B0FieldIdentifier: shared_field
  - session: '1'
    dwi:
      - dir: AP
        suffix: dwi
        metadata:
          PhaseEncodingDirection: 'j-'
          TotalReadoutTime: 0.05
          B0FieldSource: shared_field
  - session: '2'
    dwi:
      - dir: AP
        suffix: dwi
        metadata:
          PhaseEncodingDirection: 'j-'
          TotalReadoutTime: 0.05
          B0FieldSource: shared_field
