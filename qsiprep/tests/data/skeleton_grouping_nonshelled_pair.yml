# A CS-DSI acquisition with a reverse phase-encoded partner: both series use
# non-shelled q-space grids (bval content written by the test loader).
# Expected: the fsl/mixed paths error (eddy needs shells); the tortoise path
# handles it cleanly with no mixture warning (nothing is mixed).
'01':
  - anat:
      - suffix: T1w
    dwi:
      - dir: AP
        suffix: dwi
        metadata:
          PhaseEncodingDirection: 'j-'
          TotalReadoutTime: 0.05
      - dir: PA
        suffix: dwi
        metadata:
          PhaseEncodingDirection: 'j'
          TotalReadoutTime: 0.05
