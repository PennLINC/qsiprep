# Invalid curation: the same B0FieldIdentifier declared by files in two
# sessions (identifiers must be unique within a subject). Expected: a
# 'b0field-multisession' error, no estimation, and the DWIs naming it as
# B0FieldSource left unresolved.
'01':
  - session: '1'
    anat:
      - suffix: T1w
    dwi:
      - dir: AP
        suffix: dwi
        metadata:
          PhaseEncodingDirection: 'j-'
          TotalReadoutTime: 0.05
          B0FieldIdentifier: dwi_b0_field
          B0FieldSource: dwi_b0_field
      - dir: PA
        suffix: dwi
        metadata:
          PhaseEncodingDirection: 'j'
          TotalReadoutTime: 0.05
          B0FieldIdentifier: dwi_b0_field
  - session: '2'
    dwi:
      - dir: AP
        suffix: dwi
        metadata:
          PhaseEncodingDirection: 'j-'
          TotalReadoutTime: 0.05
          B0FieldIdentifier: dwi_b0_field
          B0FieldSource: dwi_b0_field
      - dir: PA
        suffix: dwi
        metadata:
          PhaseEncodingDirection: 'j'
          TotalReadoutTime: 0.05
          B0FieldIdentifier: dwi_b0_field
