# The "methods researcher" scenario from the grouping writeup, with curated
# MultipartID. Three acquisition clusters in one session:
#   clusterA: acq-A dir-AP + dir-PA          (TRT 0.05)
#   clusterB: acq-B dir-AP/PA runs 1 and 2   (TRT 0.08)
#   clusterC: acq-C dir-AP, NO reverse partner of its own (TRT 0.05)
# Expected: three outputs (MultipartID curated); one inferred axis-j
# estimation whose sources span all clusters; clusterC BORROWS b=0s for its
# correction without concatenating with the other clusters.
'01':
  - anat:
      - suffix: T1w
    dwi:
      - acq: A
        dir: AP
        suffix: dwi
        metadata:
          PhaseEncodingDirection: 'j-'
          TotalReadoutTime: 0.05
          MultipartID: clusterA
      - acq: A
        dir: PA
        suffix: dwi
        metadata:
          PhaseEncodingDirection: 'j'
          TotalReadoutTime: 0.05
          MultipartID: clusterA
      - acq: B
        dir: AP
        run: '1'
        suffix: dwi
        metadata:
          PhaseEncodingDirection: 'j-'
          TotalReadoutTime: 0.08
          MultipartID: clusterB
      - acq: B
        dir: AP
        run: '2'
        suffix: dwi
        metadata:
          PhaseEncodingDirection: 'j-'
          TotalReadoutTime: 0.08
          MultipartID: clusterB
      - acq: B
        dir: PA
        run: '1'
        suffix: dwi
        metadata:
          PhaseEncodingDirection: 'j'
          TotalReadoutTime: 0.08
          MultipartID: clusterB
      - acq: B
        dir: PA
        run: '2'
        suffix: dwi
        metadata:
          PhaseEncodingDirection: 'j'
          TotalReadoutTime: 0.08
          MultipartID: clusterB
      - acq: C
        dir: AP
        suffix: dwi
        metadata:
          PhaseEncodingDirection: 'j-'
          TotalReadoutTime: 0.05
          MultipartID: clusterC
