# One phase-encoding axis (j) at two readout times, each an opposing blip pair,
# pooled under one curated B0FieldIdentifier. TOPUP uses all four together; but
# DRBUDDI must match the readout time along with the axis, so TORTOISE splits
# into one blip pair per readout (acq-fast, acq-slow) and recombines.
'01':
  - anat:
      - suffix: T1w
    dwi:
      - acq: fast
        dir: AP
        suffix: dwi
        metadata:
          PhaseEncodingDirection: 'j-'
          TotalReadoutTime: 0.05
          B0FieldIdentifier: multiread
          B0FieldSource: multiread
      - acq: fast
        dir: PA
        suffix: dwi
        metadata:
          PhaseEncodingDirection: 'j'
          TotalReadoutTime: 0.05
          B0FieldIdentifier: multiread
          B0FieldSource: multiread
      - acq: slow
        dir: AP
        suffix: dwi
        metadata:
          PhaseEncodingDirection: 'j-'
          TotalReadoutTime: 0.08
          B0FieldIdentifier: multiread
          B0FieldSource: multiread
      - acq: slow
        dir: PA
        suffix: dwi
        metadata:
          PhaseEncodingDirection: 'j'
          TotalReadoutTime: 0.08
          B0FieldIdentifier: multiread
          B0FieldSource: multiread
