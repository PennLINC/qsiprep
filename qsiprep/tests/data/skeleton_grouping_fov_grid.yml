# AP/PA pair sampled on different voxel grids (different slice counts;
# real NIfTIs written by the test loader). Expected: the fov-grid-mismatch
# hard error - these cannot be stacked volumewise at all.
'01':
  - anat:
      - suffix: T1w
    dwi:
      - dir: AP
        suffix: dwi
        metadata:
          PhaseEncodingDirection: 'j-'
          TotalReadoutTime: 0.05
      - dir: PA
        suffix: dwi
        metadata:
          PhaseEncodingDirection: 'j'
          TotalReadoutTime: 0.05
