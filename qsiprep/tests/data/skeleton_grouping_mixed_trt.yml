# Opposing PE directions acquired with different TotalReadoutTime. Expected:
# still one inferred axis-j estimation (TOPUP handles multiple readout times
# as separate acqp rows); the two series stay in separate distortion groups
# but share one output.
'01':
  - anat:
      - suffix: T1w
    dwi:
      - dir: AP
        suffix: dwi
        metadata:
          PhaseEncodingDirection: 'j-'
          TotalReadoutTime: 0.05
      - dir: PA
        suffix: dwi
        metadata:
          PhaseEncodingDirection: 'j'
          TotalReadoutTime: 0.08
