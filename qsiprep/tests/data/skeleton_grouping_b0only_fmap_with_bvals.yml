# A dwi-like EPI fieldmap that carries bval/bvec files (some scanners cannot
# acquire a bare b=0). Expected: it serves as an SDC source only - it never
# appears in any output's dwi files.
'01':
  - anat:
      - suffix: T1w
    fmap:
      - dir: PA
        suffix: epi
        metadata:
          PhaseEncodingDirection: 'j'
          TotalReadoutTime: 0.05
          IntendedFor: ['dwi/sub-01_dir-AP_dwi.nii.gz']
      - dir: PA
        suffix: epi
        extension: .bval
      - dir: PA
        suffix: epi
        extension: .bvec
    dwi:
      - dir: AP
        suffix: dwi
        metadata:
          PhaseEncodingDirection: 'j-'
          TotalReadoutTime: 0.05
