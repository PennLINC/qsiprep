# Two same-PED DWI runs, each with its own reverse-PE EPI fieldmap linked by
# IntendedFor. Expected: two TRANSLATED estimations; the two runs share a
# distortion signature so their outputs concatenate (identical signatures),
# with the runs' distortion groups kept apart by their different fieldmaps.
'01':
  - anat:
      - suffix: T1w
    fmap:
      - dir: PA
        run: '1'
        suffix: epi
        metadata:
          PhaseEncodingDirection: 'j'
          TotalReadoutTime: 0.05
          IntendedFor: ['dwi/sub-01_dir-AP_run-1_dwi.nii.gz']
      - dir: PA
        run: '2'
        suffix: epi
        metadata:
          PhaseEncodingDirection: 'j'
          TotalReadoutTime: 0.05
          IntendedFor: ['dwi/sub-01_dir-AP_run-2_dwi.nii.gz']
    dwi:
      - dir: AP
        run: '1'
        suffix: dwi
        metadata:
          PhaseEncodingDirection: 'j-'
          TotalReadoutTime: 0.05
      - dir: AP
        run: '2'
        suffix: dwi
        metadata:
          PhaseEncodingDirection: 'j-'
          TotalReadoutTime: 0.05
