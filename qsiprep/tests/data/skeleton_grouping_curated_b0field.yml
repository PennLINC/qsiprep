# Fully curated single-estimation dataset: an EPI fieldmap and a DWI series
# share a B0FieldIdentifier, and the DWI names it as its B0FieldSource.
# Expected: one CURATED PEPOLAR estimation, no inference, no warnings.
'01':
  - anat:
      - suffix: T1w
    fmap:
      - dir: PA
        suffix: epi
        metadata:
          PhaseEncodingDirection: 'j'
          TotalReadoutTime: 0.05
          B0FieldIdentifier: pepolar
    dwi:
      - dir: AP
        suffix: dwi
        metadata:
          PhaseEncodingDirection: 'j-'
          TotalReadoutTime: 0.05
          B0FieldIdentifier: pepolar
          B0FieldSource: pepolar
