# A GRE phasediff fieldmap (phasediff + two magnitudes) linked to one DWI
# series via IntendedFor. Expected: one TRANSLATED PHASEDIFF estimation whose
# sources are the three fmap files (the DWI does not participate in a GRE
# estimation).
'01':
  - anat:
      - suffix: T1w
    fmap:
      - suffix: phasediff
        metadata:
          EchoTime1: 0.00492
          EchoTime2: 0.00738
          IntendedFor: ['dwi/sub-01_dir-AP_dwi.nii.gz']
      - suffix: magnitude1
        metadata:
          EchoTime: 0.00492
      - suffix: magnitude2
        metadata:
          EchoTime: 0.00738
    dwi:
      - dir: AP
        suffix: dwi
        metadata:
          PhaseEncodingDirection: 'j-'
          TotalReadoutTime: 0.05
