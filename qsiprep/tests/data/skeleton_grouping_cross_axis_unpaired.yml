# No same-axis reverse pair anywhere: one DWI encoded i- and one encoded j.
# Any two differing phase encodings jointly determine the field, so both
# series pool into a single inferred PEPOLAR estimation (auto+pepolar+ij).
# TOPUP consumes it (two acqp rows); DRBUDDI cannot (no opposing pair on a
# single axis -> drbuddi-no-opposing-pair error on the tortoise path).
'01':
  - anat:
      - suffix: T1w
    dwi:
      - dir: LR
        suffix: dwi
        metadata:
          PhaseEncodingDirection: 'i-'
          TotalReadoutTime: 0.05
      - dir: PA
        suffix: dwi
        metadata:
          PhaseEncodingDirection: 'j'
          TotalReadoutTime: 0.05
