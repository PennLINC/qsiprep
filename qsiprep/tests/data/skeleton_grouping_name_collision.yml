# Curated MultipartIDs that produce two outputs with the same derived BIDS
# name (both reduce to 'sub-01_dir-AP'). Expected: each MultipartID becomes
# the acq- label of its output (sub-01_acq-partA_dir-AP /
# sub-01_acq-partB_dir-AP) with an output-name-disambiguated warning.
'01':
  - anat:
      - suffix: T1w
    dwi:
      - dir: AP
        run: '1'
        suffix: dwi
        metadata:
          PhaseEncodingDirection: 'j-'
          TotalReadoutTime: 0.05
          MultipartID: partA
      - dir: AP
        run: '2'
        suffix: dwi
        metadata:
          PhaseEncodingDirection: 'j-'
          TotalReadoutTime: 0.05
          MultipartID: partA
      - dir: AP
        run: '3'
        suffix: dwi
        metadata:
          PhaseEncodingDirection: 'j-'
          TotalReadoutTime: 0.05
          MultipartID: partB
      - dir: AP
        run: '4'
        suffix: dwi
        metadata:
          PhaseEncodingDirection: 'j-'
          TotalReadoutTime: 0.05
          MultipartID: partB
