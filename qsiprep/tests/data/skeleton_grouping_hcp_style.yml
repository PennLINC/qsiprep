# HCP-style acquisition: two AP + two PA DWI series, no fmap/, no curation
# metadata. Expected: one inferred PEPOLAR estimation covering all four
# series, one concatenation group.
'01':
  - anat:
      - suffix: T1w
    dwi:
      - dir: AP
        run: '1'
        suffix: dwi
        metadata:
          PhaseEncodingDirection: 'j-'
          TotalReadoutTime: 0.05
      - dir: AP
        run: '2'
        suffix: dwi
        metadata:
          PhaseEncodingDirection: 'j-'
          TotalReadoutTime: 0.05
      - dir: PA
        run: '1'
        suffix: dwi
        metadata:
          PhaseEncodingDirection: 'j'
          TotalReadoutTime: 0.05
      - dir: PA
        run: '2'
        suffix: dwi
        metadata:
          PhaseEncodingDirection: 'j'
          TotalReadoutTime: 0.05
