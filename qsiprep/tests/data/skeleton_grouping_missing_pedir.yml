# One DWI series has no PhaseEncodingDirection at all. Expected: it becomes
# its own uncorrected singleton (missing-pedir warning); the other series is
# also uncorrected (no partner) but keeps its identity.
'01':
  - anat:
      - suffix: T1w
    dwi:
      - dir: AP
        suffix: dwi
        metadata:
          PhaseEncodingDirection: 'j-'
          TotalReadoutTime: 0.05
      - acq: legacy
        suffix: dwi
        metadata:
          EchoTime: 0.089
