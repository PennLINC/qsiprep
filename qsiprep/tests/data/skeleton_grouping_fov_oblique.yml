# AP/PA pair acquired with differently-angled fields of view (5 degrees
# about x; real NIfTIs written by the test loader). Expected: the fov-oblique
# error by default (distortion corrections would be misapplied), downgraded
# to a warning with ignore_fov=True.
'01':
  - anat:
      - suffix: T1w
    dwi:
      - dir: AP
        suffix: dwi
        metadata:
          PhaseEncodingDirection: 'j-'
          TotalReadoutTime: 0.05
      - dir: PA
        suffix: dwi
        metadata:
          PhaseEncodingDirection: 'j'
          TotalReadoutTime: 0.05
