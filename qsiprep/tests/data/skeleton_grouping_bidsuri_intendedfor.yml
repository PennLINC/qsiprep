# IntendedFor in BIDS-URI form (bids::), which pybids' get_fieldmap cannot
# resolve but qsiprep's own resolution can. Expected: identical result to
# the relative-path form.
'01':
  - anat:
      - suffix: T1w
    fmap:
      - dir: PA
        suffix: epi
        metadata:
          PhaseEncodingDirection: 'j'
          TotalReadoutTime: 0.05
          IntendedFor: ['bids::sub-01/dwi/sub-01_dir-AP_dwi.nii.gz']
    dwi:
      - dir: AP
        suffix: dwi
        metadata:
          PhaseEncodingDirection: 'j-'
          TotalReadoutTime: 0.05
