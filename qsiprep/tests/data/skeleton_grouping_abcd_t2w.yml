# ABCD-style acquisition (single AP DWI + reverse-PE epi fmap via
# IntendedFor) plus a T2w. Expected: on the mixed path, DRBUDDI has no
# reverse phase-encoded dMRI series to refine with (the epi fmap's b=0 was
# already consumed by TOPUP), so the second stage is T2Wreg against the T2w.
'01':
  - anat:
      - suffix: T1w
      - suffix: T2w
    fmap:
      - dir: PA
        suffix: epi
        metadata:
          PhaseEncodingDirection: 'j'
          TotalReadoutTime: 0.05
          IntendedFor: ['dwi/sub-01_dir-AP_dwi.nii.gz']
    dwi:
      - dir: AP
        suffix: dwi
        metadata:
          PhaseEncodingDirection: 'j-'
          TotalReadoutTime: 0.05
