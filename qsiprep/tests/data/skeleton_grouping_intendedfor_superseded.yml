# A fmap carries both B0FieldIdentifier and IntendedFor. B0Field wins: the
# epi pair corrects run-1 (linked by B0FieldSource); the PA epi's IntendedFor
# points at run-2, which is ignored, so run-2 is left uncorrected. Expected:
# an intendedfor-superseded warning and no fieldmap applied to run-2.
'01':
  - anat:
      - suffix: T1w
    fmap:
      - dir: AP
        suffix: epi
        metadata:
          PhaseEncodingDirection: 'j-'
          TotalReadoutTime: 0.05
          B0FieldIdentifier: pepolar01
      - dir: PA
        suffix: epi
        metadata:
          PhaseEncodingDirection: 'j'
          TotalReadoutTime: 0.05
          B0FieldIdentifier: pepolar01
          IntendedFor: ['bids::sub-01/dwi/sub-01_dir-AP_run-2_dwi.nii.gz']
    dwi:
      - dir: AP
        run: '1'
        suffix: dwi
        metadata:
          PhaseEncodingDirection: 'j-'
          TotalReadoutTime: 0.05
          B0FieldSource: pepolar01
      - dir: AP
        run: '2'
        suffix: dwi
        metadata:
          PhaseEncodingDirection: 'j-'
          TotalReadoutTime: 0.05
