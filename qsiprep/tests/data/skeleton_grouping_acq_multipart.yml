# MultipartIDs with the 'acq-' prefix do double duty: they group the series
# AND rename the acq- entity of the output. Same file layout as
# name_collision, but the outputs are named explicitly
# (sub-01_acq-partA_dir-AP / sub-01_acq-partB_dir-AP): no collision, no
# warning.
'01':
  - anat:
      - suffix: T1w
    dwi:
      - dir: AP
        run: '1'
        suffix: dwi
        metadata:
          PhaseEncodingDirection: 'j-'
          TotalReadoutTime: 0.05
          MultipartID: acq-partA
      - dir: AP
        run: '2'
        suffix: dwi
        metadata:
          PhaseEncodingDirection: 'j-'
          TotalReadoutTime: 0.05
          MultipartID: acq-partA
      - dir: AP
        run: '3'
        suffix: dwi
        metadata:
          PhaseEncodingDirection: 'j-'
          TotalReadoutTime: 0.05
          MultipartID: acq-partB
      - dir: AP
        run: '4'
        suffix: dwi
        metadata:
          PhaseEncodingDirection: 'j-'
          TotalReadoutTime: 0.05
          MultipartID: acq-partB
