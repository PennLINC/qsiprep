# One phase-encoding axis (j) pooled under one curated B0FieldIdentifier: a
# matched blip pair (acq-fast, TRT 0.05) plus an unmatched singleton (acq-slow
# AP, TRT 0.08, no reverse partner). On the TORTOISE path DRBUDDI corrects the
# pair; the singleton has no opposing blip, so it falls back to T2Wreg (a T2w is
# present). Both are concatenated into one output.
'01':
  - anat:
      - suffix: T1w
      - suffix: T2w
    dwi:
      - acq: fast
        dir: AP
        suffix: dwi
        metadata:
          PhaseEncodingDirection: 'j-'
          TotalReadoutTime: 0.05
          B0FieldIdentifier: jpool
          B0FieldSource: jpool
      - acq: fast
        dir: PA
        suffix: dwi
        metadata:
          PhaseEncodingDirection: 'j'
          TotalReadoutTime: 0.05
          B0FieldIdentifier: jpool
          B0FieldSource: jpool
      - acq: slow
        dir: AP
        suffix: dwi
        metadata:
          PhaseEncodingDirection: 'j-'
          TotalReadoutTime: 0.08
          B0FieldIdentifier: jpool
          B0FieldSource: jpool
