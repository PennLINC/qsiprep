on:
  pull_request:

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number }}
  cancel-in-progress: true

permissions:
  contents: read

defaults:
  run:
    shell: bash

jobs:
  validate-lockfile:
    if: ${{ github.event.pull_request.head.repo.full_name != github.repository }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout pull request
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          fetch-depth: 0
          persist-credentials: false
      - name: Check pull request for dependency edits
        id: dependencies
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
        run: |
          CHANGED_FILES="$(git diff --name-only "$BASE_SHA"...HEAD -- pyproject.toml pixi.lock)"
          if [ -n "$CHANGED_FILES" ]; then
            echo "changed=true" >> "$GITHUB_OUTPUT"
          else
            echo "changed=false" >> "$GITHUB_OUTPUT"
            echo "Pull request did not touch pyproject.toml or pixi.lock; skipping lockfile validation."
          fi
      - uses: prefix-dev/setup-pixi@ad1da6449d9e506fd127fd67ab2d054a769f6a94 # v0.11.2
        if: ${{ steps.dependencies.outputs.changed == 'true' }}
        with:
          pixi-version: v0.58.0
          run-install: false
          cache: false
      - name: Validate lockfile
        if: ${{ steps.dependencies.outputs.changed == 'true' }}
        run: pixi lock --check

  update-lockfile:
    # Only branches in this repository may receive automatic commits.
    if: ${{ github.event.pull_request.head.repo.full_name == github.repository }}
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout pull request
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          fetch-depth: 0
          # The token goes to the push step alone, so the pixi and DataLad steps,
          # which build the PR's package, never find it in .git/config.
          persist-credentials: false
      - name: Check pull request for dependency edits
        id: dependencies
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
        run: |
          CHANGED_FILES="$(git diff --name-only "$BASE_SHA"...HEAD -- pyproject.toml pixi.lock)"
          if [ -n "$CHANGED_FILES" ]; then
            echo "changed=true" >> "$GITHUB_OUTPUT"
          else
            echo "changed=false" >> "$GITHUB_OUTPUT"
            echo "Pull request did not touch pyproject.toml or pixi.lock; skipping lockfile update."
          fi
      - uses: prefix-dev/setup-pixi@ad1da6449d9e506fd127fd67ab2d054a769f6a94 # v0.11.2
        if: ${{ steps.dependencies.outputs.changed == 'true' }}
        with:
          pixi-version: v0.58.0
          run-install: false
          cache: false
      # pixi lock --check can pass and still rewrite pixi.lock, because the workspace
      # package's hatch-vcs version changes with every commit. Restore the committed
      # file after the check, so that only a real update below is ever committed.
      - name: Check lockfile
        if: ${{ steps.dependencies.outputs.changed == 'true' }}
        id: check
        run: |
          if pixi lock --check; then
            echo "stale=false" >> "$GITHUB_OUTPUT"
            echo "Lockfile up to date."
          else
            echo "stale=true" >> "$GITHUB_OUTPUT"
          fi
          # Leave a clean tree for datalad run to record the update
          git checkout -- pixi.lock
      - name: Set git identity
        if: ${{ steps.check.outputs.stale == 'true' }}
        run: |
          git config user.name "nipreps[bot]"
          git config user.email "bot@nipreps.org"
      - name: Install the latest version of uv
        if: ${{ steps.check.outputs.stale == 'true' }}
        uses: astral-sh/setup-uv@37802adc94f370d6bfd71619e3f0bf239e1f3b78 # v7.6.0
      # Lock all environments (default, test, qsiprep). The qsiprep env must use the
      # non-editable workspace package variant (production feature) so the Docker
      # runtime image can copy only the env; the Dockerfile forces a non-editable
      # install if the lockfile resolves qsiprep to the editable variant.
      - name: Update lockfile
        if: ${{ steps.check.outputs.stale == 'true' }}
        run: uvx datalad run -i pixi.lock -i pyproject.toml -o pixi.lock -- pixi lock
      - name: Push updated lockfile
        if: ${{ steps.check.outputs.stale == 'true' }}
        env:
          GH_TOKEN: ${{ github.token }}
          BRANCH: ${{ github.event.pull_request.head.ref }}
        run: |
          set -euo pipefail
          auth=$(printf 'x-access-token:%s' "$GH_TOKEN" | base64 -w0)
          echo "::add-mask::$auth"
          git -c "http.https://github.com/.extraheader=AUTHORIZATION: basic $auth" \
            push "https://github.com/$GITHUB_REPOSITORY.git" "HEAD:refs/heads/$BRANCH"

  check-lockfile:
    if: ${{ always() }}
    needs: [validate-lockfile, update-lockfile]
    runs-on: ubuntu-latest
    permissions: {}
    steps:
      - name: Require the applicable lockfile job to succeed
        env:
          VALIDATION_RESULT: ${{ needs.validate-lockfile.result }}
          UPDATE_RESULT: ${{ needs.update-lockfile.result }}
        run: |
          if [[ "$VALIDATION_RESULT" == "success" && "$UPDATE_RESULT" == "skipped" ]] ||
             [[ "$VALIDATION_RESULT" == "skipped" && "$UPDATE_RESULT" == "success" ]]; then
            echo "Lockfile check passed."
          else
            echo "::error::Lockfile validation: $VALIDATION_RESULT; lockfile update: $UPDATE_RESULT"
            exit 1
          fi
