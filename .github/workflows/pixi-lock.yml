on:
  pull_request:

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number }}
  cancel-in-progress: true

permissions:
  contents: read

defaults:
  run:
    shell: bash

jobs:
  validate-lockfile:
    if: ${{ github.event.pull_request.head.repo.full_name != github.repository }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout pull request
        uses: actions/checkout@v7
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          fetch-depth: 0
          persist-credentials: false
      - name: Check pull request for dependency edits
        id: dependencies
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
        run: |
          CHANGED_FILES="$(git diff --name-only "$BASE_SHA"...HEAD -- pyproject.toml pixi.lock)"
          if [ -n "$CHANGED_FILES" ]; then
            echo "changed=true" >> "$GITHUB_OUTPUT"
          else
            echo "changed=false" >> "$GITHUB_OUTPUT"
            echo "Pull request did not touch pyproject.toml or pixi.lock; skipping lockfile validation."
          fi
      - uses: prefix-dev/setup-pixi@v0.11.2
        if: ${{ steps.dependencies.outputs.changed == 'true' }}
        with:
          pixi-version: v0.58.0
          run-install: false
          cache: false
      - name: Validate lockfile
        if: ${{ steps.dependencies.outputs.changed == 'true' }}
        run: pixi lock --check

  update-lockfile:
    # Only branches in this repository may receive automatic commits.
    if: ${{ github.event.pull_request.head.repo.full_name == github.repository }}
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout pull request
        uses: actions/checkout@v7
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          fetch-depth: 0
      - name: Check pull request for dependency edits
        id: latest-commit
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
        run: |
          HEAD_AUTHOR="$(git log -1 --format=%an HEAD)"
          CHANGED_FILES="$(git diff --name-only "$BASE_SHA"...HEAD -- pyproject.toml pixi.lock)"
          if [ "$HEAD_AUTHOR" == "nipreps[bot]" ]; then
            # A head commit from the bot was produced by this job, so the lockfile is
            # already up to date. Running again would only rewrite the workspace
            # package version and push once more.
            echo "run_lockfile_update=false" >> "$GITHUB_OUTPUT"
            echo "Head commit was pushed by nipreps[bot]; skipping lockfile update."
          elif [ -n "$CHANGED_FILES" ]; then
            echo "run_lockfile_update=true" >> "$GITHUB_OUTPUT"
          else
            echo "run_lockfile_update=false" >> "$GITHUB_OUTPUT"
            echo "Pull request did not touch pyproject.toml or pixi.lock; skipping lockfile update."
          fi
      - name: Set git identity
        if: ${{ steps.latest-commit.outputs.run_lockfile_update == 'true' }}
        run: |
          git config user.name "nipreps[bot]"
          git config user.email "bot@nipreps.org"
      - uses: prefix-dev/setup-pixi@v0.11.2
        if: ${{ steps.latest-commit.outputs.run_lockfile_update == 'true' }}
        with:
          pixi-version: v0.58.0
          run-install: false
          cache: false
      - name: Install the latest version of uv
        if: ${{ steps.latest-commit.outputs.run_lockfile_update == 'true' }}
        uses: astral-sh/setup-uv@v7
      # Lock all environments (default, test, qsiprep). The qsiprep env must use the
      # non-editable workspace package variant (production feature) so the Docker
      # runtime image can copy only the env; the Dockerfile forces a non-editable
      # install if the lockfile resolves qsiprep to the editable variant.
      - name: Update lockfile
        if: ${{ steps.latest-commit.outputs.run_lockfile_update == 'true' }}
        run: >
          uvx datalad run -i pixi.lock -i pyproject.toml -o pixi.lock --
          bash -lc "if pixi lock --check; then echo 'Lockfile up to date'; else pixi lock; fi"
      # pixi lock resolves the workspace package with its hatch-vcs version, which
      # changes with every commit, so datalad may commit a lockfile that differs
      # from the head commit only in the version, sha256 and editable lines of the
      # "pypi: ./" workspace package entries. Pushing that commit would trigger
      # another run that rewrites the version again, and so on. Push only when
      # something else changed.
      - name: Check whether the lockfile changed beyond the workspace package version
        if: ${{ steps.latest-commit.outputs.run_lockfile_update == 'true' }}
        id: lockfile-diff
        env:
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          if git diff --exit-code -I '^  (version|sha256|editable): ' "$HEAD_SHA" HEAD -- pixi.lock; then
            echo "push=false" >> "$GITHUB_OUTPUT"
            echo "Lockfile is unchanged apart from the workspace package version; nothing to push."
          else
            echo "push=true" >> "$GITHUB_OUTPUT"
          fi
      - name: Push updated lockfile, if needed
        if: ${{ steps.lockfile-diff.outputs.push == 'true' }}
        run: git push origin "HEAD:refs/heads/$BRANCH"
        env:
          BRANCH: ${{ github.event.pull_request.head.ref }}

  check-lockfile:
    if: ${{ always() }}
    needs: [validate-lockfile, update-lockfile]
    runs-on: ubuntu-latest
    permissions: {}
    steps:
      - name: Require the applicable lockfile job to succeed
        env:
          VALIDATION_RESULT: ${{ needs.validate-lockfile.result }}
          UPDATE_RESULT: ${{ needs.update-lockfile.result }}
        run: |
          if [[ "$VALIDATION_RESULT" == "success" && "$UPDATE_RESULT" == "skipped" ]] ||
             [[ "$VALIDATION_RESULT" == "skipped" && "$UPDATE_RESULT" == "success" ]]; then
            echo "Lockfile check passed."
          else
            echo "::error::Lockfile validation: $VALIDATION_RESULT; lockfile update: $UPDATE_RESULT"
            exit 1
          fi
