name: Pixi lock

# Runs the PR's code with a read-only token. A stale lockfile on a same-repo PR is
# regenerated here and handed to pixi-lock-push.yml as a patch artifact, which
# pushes it. Nothing in this workflow can write to the repository.
on:
  pull_request:

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number }}
  cancel-in-progress: true

permissions:
  contents: read

defaults:
  run:
    shell: bash

jobs:
  check-lockfile:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout pull request
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          fetch-depth: 0
          persist-credentials: false
      - name: Check pull request for dependency edits
        id: dependencies
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
        run: |
          CHANGED_FILES="$(git diff --name-only "$BASE_SHA"...HEAD -- pyproject.toml pixi.lock)"
          if [ -n "$CHANGED_FILES" ]; then
            echo "changed=true" >> "$GITHUB_OUTPUT"
          else
            echo "changed=false" >> "$GITHUB_OUTPUT"
            echo "Pull request did not touch pyproject.toml or pixi.lock; skipping lockfile check."
          fi
      - uses: prefix-dev/setup-pixi@ad1da6449d9e506fd127fd67ab2d054a769f6a94 # v0.11.2
        if: ${{ steps.dependencies.outputs.changed == 'true' }}
        with:
          pixi-version: v0.58.0
          run-install: false
          cache: false
      # pixi lock --check can pass and still rewrite pixi.lock, because the workspace
      # package's hatch-vcs version changes with every commit. Restore the committed
      # file after the check, so that only a real update below is ever exported.
      - name: Check lockfile
        if: ${{ steps.dependencies.outputs.changed == 'true' }}
        id: check
        run: |
          # Only an existing lockfile is regenerated: the push workflow accepts a
          # patch that modifies pixi.lock, never one that creates it
          if ! git cat-file -e HEAD:pixi.lock 2>/dev/null; then
            echo "::error::This pull request deletes pixi.lock. Restore it from the base branch, then run \`pixi lock\` on Linux if it needs updating."
            exit 1
          fi
          if pixi lock --check; then
            echo "stale=false" >> "$GITHUB_OUTPUT"
            echo "Lockfile up to date."
          else
            echo "stale=true" >> "$GITHUB_OUTPUT"
          fi
          # Leave a clean tree for datalad run to record the update
          git checkout -- pixi.lock
      # Only same-repo branches receive automatic commits. A fork's lockfile is
      # checked, and the job fails below, but nothing is regenerated.
      - name: Set git identity
        if: ${{ steps.check.outputs.stale == 'true' && github.event.pull_request.head.repo.full_name == github.repository }}
        run: |
          git config user.name "nipreps[bot]"
          git config user.email "bot@nipreps.org"
      - name: Install the latest version of uv
        if: ${{ steps.check.outputs.stale == 'true' && github.event.pull_request.head.repo.full_name == github.repository }}
        uses: astral-sh/setup-uv@37802adc94f370d6bfd71619e3f0bf239e1f3b78 # v7.6.0
      # Lock all environments (default, test, qsiprep). The qsiprep env must use the
      # non-editable workspace package variant (production feature) so the Docker
      # runtime image can copy only the env; the Dockerfile forces a non-editable
      # install if the lockfile resolves qsiprep to the editable variant.
      - name: Update lockfile
        if: ${{ steps.check.outputs.stale == 'true' && github.event.pull_request.head.repo.full_name == github.repository }}
        run: uvx datalad run -i pixi.lock -i pyproject.toml -o pixi.lock -- pixi lock
      - name: Export lockfile patch
        if: ${{ steps.check.outputs.stale == 'true' && github.event.pull_request.head.repo.full_name == github.repository }}
        env:
          PR_NUMBER: ${{ github.event.pull_request.number }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          set -euo pipefail
          # datalad run makes no commit when pixi lock changes nothing, as after a
          # check that failed for some other reason; exporting HEAD would then
          # export the PR's own head commit
          if [[ "$(git rev-parse HEAD~1)" != "$HEAD_SHA" ]]; then
            echo "::error file=pixi.lock::pixi lock --check failed, but pixi lock changed nothing; re-run this job."
            exit 1
          fi
          mkdir -p "$RUNNER_TEMP/pixi-lock"
          git format-patch -1 --stdout > "$RUNNER_TEMP/pixi-lock/pixi-lock.patch"
          printf '%s\n' "$PR_NUMBER" > "$RUNNER_TEMP/pixi-lock/pr-number"
      - name: Upload lockfile patch
        if: ${{ steps.check.outputs.stale == 'true' && github.event.pull_request.head.repo.full_name == github.repository }}
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: pixi-lock
          path: ${{ runner.temp }}/pixi-lock/
          if-no-files-found: error
          retention-days: 1
      # The failure is what starts pixi-lock-push.yml, and it keeps a stale
      # lockfile from looking green until the regenerated one is pushed.
      - name: Fail on stale lockfile
        if: ${{ steps.check.outputs.stale == 'true' }}
        env:
          SAME_REPO: ${{ github.event.pull_request.head.repo.full_name == github.repository }}
        run: |
          if [[ "$SAME_REPO" == "true" ]]; then
            echo "::error file=pixi.lock::pixi.lock is out of date. The Pixi lock push workflow will commit a regenerated pixi.lock to this branch. Checks on that commit may wait for a maintainer's approval, or not start at all; push another commit, or close and reopen the PR, to run them."
          else
            echo "::error file=pixi.lock::pixi.lock is out of date. Run \`pixi lock\` on Linux and push the result to this branch."
          fi
          exit 1
